name: Build 26.x

on:
  push:
    branches: [26]
  pull_request:
    branches: [26]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build with Gradle
        run: |
          gradle build --no-daemon --stacktrace > gradle-build.log 2>&1 || BUILD_FAILED=1
          if [ -n "$BUILD_FAILED" ]; then
            echo "===== GRADLE BUILD FAILED, LAST 150 LINES =====" >&2
            tail -n 150 gradle-build.log >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xuanjianmod-26
          path: build/libs/*.jar
          if-no-files-found: error
