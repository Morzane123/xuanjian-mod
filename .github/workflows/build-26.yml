name: Build 26.x

on:
  push:
    branches: [26]
  pull_request:
    branches: [26]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build with Gradle
        run: |
          gradle build --no-daemon --stacktrace > gradle-build.log 2>&1 || BUILD_FAILED=1
          if [ -n "$BUILD_FAILED" ]; then
            echo "===== GRADLE BUILD FAILED ====="
            grep -E "FAILURE|error:|Error:|Could not|could not resolve|No matching|not found|Exception|What went wrong|> Task" gradle-build.log | tail -n 50
            echo "===== LAST 20 LINES ====="
            tail -n 20 gradle-build.log
            echo "===== END ====="
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xuanjianmod-26
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create/Update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-26.2
          name: xuanjianmod 26.2.x (v1.0.1-26.2)
          body: |
            Xuanjian Guild Mod — Minecraft 26.2.x Fabric 构建（含信息面板 / 设置页 GUI）。
            - 修正 GUI 信息面板 / 设置页（按 26.2 渲染 API 适配）
            - 支持绑定 / 签到 / 任务 / 贡献点转账申报 / 日报决策同步
          make_latest: true
          files: build/libs/*.jar
          fail_on_unmatched_files: false
