name: Build 1.21.x

on:
  push:
    branches: [1.21]
  pull_request:
    branches: [1.21]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build with Gradle
        run: |
          gradle build --no-daemon --stacktrace > gradle-build.log 2>&1 || BUILD_FAILED=1
          if [ -n "$BUILD_FAILED" ]; then
            echo "===== GRADLE BUILD FAILED, LAST 150 LINES =====" >&2
            tail -n 150 gradle-build.log >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xuanjianmod-121
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create/Update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-1.21.11
          name: xuanjianmod 1.21.x (v1.0.1-1.21.11)
          body: |
            Xuanjian Guild Mod — Minecraft 1.21.11 Fabric 构建（含信息面板 / 设置页 GUI）。
            - 修正 GUI 信息面板 / 设置页（文本区不再遮挡按钮，异步任务先快照 UUID）
            - 支持绑定 / 签到 / 任务 / 贡献点转账申报 / 日报决策同步
          make_latest: false
          files: build/libs/*.jar
          fail_on_unmatched_files: false
