name: Build 26.1.x

# 26.1 分支：面向 Minecraft 26.1.x（含 26.1.2）的独立构建。
# 26.1 与 26.2 的客户端 GUI 渲染 API 不兼容（extractRenderState/gui.setScreen 为 26.2 独有），
# 因此 26.1 需要独立的源码分支与独立的构建产物，不能复用 26 分支的 jar。
on:
  push:
    branches: [26.1]
  pull_request:
    branches: [26.1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build with Gradle
        run: |
          gradle build --no-daemon --stacktrace > gradle-build.log 2>&1 || BUILD_FAILED=1
          if [ -n "$BUILD_FAILED" ]; then
            echo "===== GRADLE BUILD FAILED, LAST 150 LINES =====" >&2
            tail -n 150 gradle-build.log >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xuanjianmod-261
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create/Update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-26.1
          name: xuanjianmod 26.1.x (v0.1.0-26.1)
          body: |
            Xuanjian Guild Mod — Minecraft 26.1.x（含 26.1.2）Fabric 构建。
            - 修复 26.1.2 版本无法加载问题（依赖范围 ~26.1）
            - 支持绑定 / 签到 / 任务 / 贡献点转账申报 / 日报决策同步
          make_latest: false
          files: build/libs/*.jar
          fail_on_unmatched_files: false
